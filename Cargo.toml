[package]
name = "paddler"
authors = ["seckinu"]
description = "Match against word(s) with a simple and extensible syntax"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[features]
dictionary = ["dep:clap", "dep:rayon"]

[lib]
name = "paddler"
path = "src/lib.rs"

[[bin]]
name = "paddler"
path = "src/main.rs"
required-features = ["dictionary"]

[dependencies]
itertools = "0.14.0"
phf = "0.14.0"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"
# CLI Dependencies
clap = { version = "4.6.1", features = ["derive"], optional = true }
rayon = { version = "1.12.0", optional = true }

[build-dependencies]
phf = { version = "0.14.0", default-features = false }
phf_codegen = "0.14.0"
strum_macros = "0.28.0"
